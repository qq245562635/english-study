<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6fed">
  <title>每日英语 15 分钟</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>每日英语 <span>15 分钟</span></h1>
    <div class="streak" id="streakBadge" title="连续学习天数">🔥 0 天</div>
  </header>

  <main id="view"></main>

  <nav class="tabs" id="tabs">
    <button data-tab="today" class="active"><span>📅</span>今天</button>
    <button data-tab="words"><span>📚</span>单词</button>
    <button data-tab="phrases"><span>💬</span>句子</button>
    <button data-tab="me"><span>👤</span>我的</button>
  </nav>

  <script src="data/words.js"></script>
  <script src="data/phrases.js"></script>
  <script src="app.js"></script>
</body>
</html>
